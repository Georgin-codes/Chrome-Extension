<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <link rel="manifest" href="/manifest.json">
    <title>Document</title>
</head>
<body>
    <main id="main">
        <form id="form">
            <div class="container" id="container">
            </div>
            <div class="btns">
                <button class="btn" id="btn" disabled data-value="create">Create Workspace</button>
                <button class="btn" id="my-wokspaces-btn" disabled data-value="view">My Workspaces</button>
            </div>
        </form>
    </main>

    <div class="box-container" id="box-container">
        <form class="workspace-form" id="workspace-form">
            <p id="response">Give a name for your workspace</p>
            <input class="workspace-input" id="workspace-input" name="workspace-input" type="text" required placeholder="Type workspae name here">
            <div class="buttons-container" id="buttons">
                <button class="buttons" id="save-btn" data-action="save" disabled>Save</button>
                <button class="buttons" id="cancel-btn" data-action="cancel" formnovalidate>Cancel</button>
            </div>
        </form>
    </div>

     <div class="delete-msg-container" id="delete-msg-container">
    </div>

    <!-- <div class="saved-workspaces">
        <div class="wokspaces">
            <div class="title">
                <h3>Title</h3>
            </div>
            <ul class="list" id="list">
                <li><span class="lead-info">Orange</span> <button class="delete-btn">X</button></li>
                <li>Banana</li>
            </ul>
        </div>
    </div> -->

    <div class="workspace-elements" id="workspace-elements">

        <form class="workspace-elements-form" id="workspace-elements-form">

            <div class="tabs-container" id="tabs-container">
                <!-- <div class="tabs">
                    <input class="inputs" id="checkbox-${id}" type="checkbox" name="tab" value="${id}">
                    <label class="labels" for="checkbox-${id}" name="tab">${title}</label>
                </div> -->
            </div>

            <div class="workspace-btns" id="workspace-btns">
                <!-- <button class="select-buttons" id="workspace-el-save" data-choose="save" disabled>Save</button>
                <button class="select-buttons"id="workspace-el-delete" data-choose="delete" disabled>Delete</button> -->
            </div>

        </form>

        <button class="created-workspaces-close" id="workspace-elements-close">X</button>
    </div>

    <div class="created-workspaces-container" id="created-workspaces-container">
        <form class="created-workspaces-form" id="created-workspaces-form">

            <label for="workspace-values" class="select-label">Choose a workspace</label>

            <select class="workspace-values" id="workspace-values" name="workspace-values">
                <!-- <option value="">Apple</option>
                <option value="">Bnanana</option>
                <option value="">Orange</option> -->
            </select>

            <div class="select-btn-container">
                <button class="select-buttons" data-user-action="view">View</button>
                <button class="select-buttons" data-user-action="open">Open</button>
            </div>

        </form>

        <button class="created-workspaces-close" id="created-workspaces-close">X</button>
    </div>

    <script src="./index.js" type="module"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <link rel="manifest" href="/manifest.json">
    <title>Document</title>
</head>
<body>
    <main id="main">
        <form id="form">
            <div class="container" id="container">
            </div>
            <button class="btn" id="btn">Create Workspace</button>
        </form>
    </main>

    <div class="box-container" id="box-container">
        <form class="workspace-form" id="workspace-form">
            <input class="workspace-input" id="workspace-input" name="workspace-input" type="text" placeholder="Give a name for your workspace">
            <div class="buttons-container" id="buttons">
                <button class="buttons" id="save-btn" data-action="save" disabled>Save</button>
                <button class="buttons" id="cancel-btn" data-action="cancel">Cancel</button>
            </div>
        </form>
    </div>

     <div class="delete-msg-container" id="delete-msg-container">
    </div>

    <script src="./index.js" type="module"></script>

</body>
</html>
